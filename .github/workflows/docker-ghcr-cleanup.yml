name: Cleanup Old GHCR Container Images

on:
  schedule:
    - cron: '30 3 * * 0'   # weekly, Sunday 03:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clean up old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          # Derived from the repository rather than hardcoded, so the workflow
          # cleans this repository's own package wherever it runs.
          owner: ${{ github.repository_owner }}
          package: ${{ github.event.repository.name }}

          # Never prune the rolling branch images or published release tags.
          # Branch pushes tag with the branch name (and <branch>-<sha>).
          exclude-tags: 'latest,dev,staging,unstable,pix-lgbt,stable,v*.*.*'
          older-than: 6 months
          delete-untagged: true
          keep-n-tagged: 25
